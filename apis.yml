apis:
- name: VoiceOps MCP Server
  description: >-
    Live first-party remote Model Context Protocol server operated by VoiceOps.
    JSON-RPC 2.0 over HTTP (streamable HTTP transport), authenticated with a
    VoiceOps API key sent in the Authorization header. tools/list is auth-gated,
    so the tool set is not recorded. The server is undocumented — it appears on
    no VoiceOps page, in no sitemap, and in no MCP registry — and was found by
    direct host probing. Host ownership is confirmed by a single Amazon-issued
    TLS certificate covering mcp.voiceops.com, api.voiceops.com and
    app.voiceops.com.
  humanURL: https://www.voiceops.com/
  baseURL: https://mcp.voiceops.com/mcp
