aid: voiceops
name: VoiceOps
description: >-
  VoiceOps is an AI agent platform that analyzes customer conversations across
  calls, email, SMS, and chat and turns them into structured business
  intelligence — transcription and analysis in 120+ languages, CRM enrichment,
  lead scoring, compliance monitoring, competitive intelligence, and churn
  detection for high-velocity sales, CX, and operations teams. It pipes
  structured conversation records into Salesforce, HubSpot, Genesys, Five9,
  Snowflake, Power BI, Slack, Teams, and webhooks. Backed by Bain Capital
  Ventures. No public developer portal is currently published; a previously
  documented Call Integration API and Reporting API knowledge base is offline,
  and the live api.voiceops.com host backs the app.voiceops.com application.
